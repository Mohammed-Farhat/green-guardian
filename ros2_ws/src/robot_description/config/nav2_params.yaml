# ============================================================
#  GREEN GUARDIAN — Nav2 Parameters (ROS 2 Jazzy)
#  Used by: launch/nav2.launch.py
# ============================================================

amcl:
  ros__parameters:
    use_sim_time: false

    # ── Motion model ──────────────────────────────────────────
    robot_model_type: nav2_amcl::DifferentialMotionModel
    # Odometry noise parameters (tune if localisation drifts)
    alpha1: 0.2   # rotation noise from rotation
    alpha2: 0.2   # rotation noise from translation
    alpha3: 0.2   # translation noise from translation
    alpha4: 0.2   # translation noise from rotation
    alpha5: 0.2   # strafe noise (unused for diff drive, keep 0.2)

    # ── Frames ───────────────────────────────────────────────
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan
    map_topic: map

    # ── Particle filter ──────────────────────────────────────
    min_particles: 500
    max_particles: 5000   # more particles = better global relocalization
    resample_interval: 1
    pf_err: 0.05          # population error
    pf_z: 0.99            # population z-score
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # ── Laser model (likelihood_field) ───────────────────────
    # likelihood_field is faster and more robust than beam model
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0  # max dist for likelihood table (m)
    max_beams: 60                   # subsample the scan to N beams
    sigma_hit: 0.2                  # std-dev of Gaussian hit model (m)
    z_hit: 0.5                      # weight of hit model  (z_hit + z_rand = 1.0)
    z_rand: 0.5                     # weight of random model
    # NOTE: z_short and z_max are only for the beam model; keep here but unused
    z_short: 0.05
    z_max: 0.05
    lambda_short: 0.1
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false

    # ── Update thresholds ────────────────────────────────────
    update_min_d: 0.10    # min translation (m) before filter update (was 0.25 — too coarse)
    update_min_a: 0.1     # min rotation (rad) before filter update  (was 0.2)

    # ── TF & transform ───────────────────────────────────────
    tf_broadcast: true          # AMCL must publish map→odom TF
    transform_tolerance: 1.0   # seconds

    # ── Initial pose ─────────────────────────────────────────
    # true = AMCL immediately publishes map→odom TF at (0,0,0) on startup.
    # This lets the global_costmap activate without timing out waiting for
    # the user to click "2D Pose Estimate" first.
    # The user still corrects the pose in RViz; AMCL relocates from laser data.
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only_: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # ── FIX: Load only navigate_to_pose navigator ─────────────
    # In Jazzy, EACH navigator independently loads plugin_lib_names into the
    # SHARED BehaviorTreeFactory.  With two navigators active, every plugin is
    # loaded twice → "ID [ComputePathToPose] already registered" FATAL crash.
    # navigate_through_poses is not needed for basic autonomous nav; waypoint
    # follower uses navigate_to_pose internally so it still works.
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    # ── BT plugin library names ───────────────────────────────
    # Loaded once (only navigate_to_pose navigator is active).
    # Two plugins REMOVED — they share .so with compute_path_to_pose on this
    # Pi's Nav2 build, causing double-registration even with one navigator:
    #   nav2_remove_in_collision_goals_action_bt_node
    #   nav2_get_pose_from_path_action_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    # Thresholds below which velocity is considered zero
    # For differential drive: keep min_y high (robot cannot move sideways)
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # ── DWB local planner ─────────────────────────────────────
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      # Velocity limits — match hardware_params.yaml max_velocity
      min_vel_x: 0.0
      min_vel_y: 0.0
      # Capped forward speed so the demo looks controlled in the 4 m arena.
      max_vel_x: 0.15
      max_vel_y: 0.0
      # Bumped to 1.5 — DWB needs rotational headroom; with stiction comp in
      # motor_bridge, low PWM rotations now actually move the wheels.
      max_vel_theta: 1.5
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      # Gentler longitudinal acceleration so the robot doesn't lurch off the line.
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      # Trajectory sampling
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle",
                "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Rectangular footprint (0.40 m × 0.30 m chassis + 2 cm margin all around).
      # Using a polygon (not robot_radius) so the lethal/inscribed zone is the
      # half-width 0.17 m, not the diagonal 0.25 m — recovers ~10 cm of usable
      # space along each wall.
      footprint: "[[0.22, 0.17], [0.22, -0.17], [-0.22, -0.17], [-0.22, 0.17]]"
      always_send_full_costmap: true
      # ── Plugins ──────────────────────────────────────────────
      # FIX: was voxel_layer (3D sensor layer — wrong for 2D LiDAR).
      # ObstacleLayer is the correct choice for the RPLidar A1.
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.12  # clear cells slightly closer than marking range
          obstacle_max_range: 2.5
          obstacle_min_range: 0.15  # RPLidar A1 min reliable range — ignore nearer noise
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # cost_scaling_factor higher → cost decays faster → less blue in RViz.
        # inflation_radius shrunk from 0.30 → 0.20: gradient is only ~3 cm wide
        # past the 0.17 m inscribed circle. Keeps a small safety buffer but
        # leaves most of the arena white/free.
        cost_scaling_factor: 5.0
        inflation_radius: 0.20

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.22, 0.17], [0.22, -0.17], [-0.22, -0.17], [-0.22, 0.17]]"
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.12
          obstacle_max_range: 2.5
          obstacle_min_range: 0.15  # RPLidar A1 min reliable range — ignore nearer noise
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # cost_scaling_factor higher → cost decays faster → less blue in RViz.
        # inflation_radius shrunk from 0.30 → 0.20: gradient is only ~3 cm wide
        # past the 0.17 m inscribed circle. Keeps a small safety buffer but
        # leaves most of the arena white/free.
        cost_scaling_factor: 5.0
        inflation_radius: 0.20

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""   # overridden at launch by map:= argument

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    # ── Jazzy-correct parameter names (1.3.x) ────────────────
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading",
                       "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    # FIX: local_frame = frame for obstacle checks during recovery (odom)
    #      global_frame = world/map frame (map) — was wrongly set to odom
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
