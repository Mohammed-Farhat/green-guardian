ekf_filter_node:
  ros__parameters:

    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    imu0: /imu
    imu0_config: [false, false, false,   # x, y, z position       — ignore
                  false, false, false,   # roll, pitch, yaw        — ignore (no orientation)
                  false, false, false,   # vx, vy, vz              — ignore
                  false, false, true,    # vroll, vpitch, vyaw     — USE yaw rate only
                  false, false, false]   # ax, ay, az              — ignore (uncalibrated bias)
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
